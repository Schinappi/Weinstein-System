[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "winstan"
version = "0.1.0"
description = "Weinstein screener and dashboard for A-share equities."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "baostock>=0.9.2",
  "duckdb>=1.1.3",
  "numpy>=2.1.0",
  "pandas>=2.2.3",
  "polars>=1.17.1",
  "pyarrow>=18.0.0",
  "pyyaml>=6.0.2",
  "requests>=2.32.3",
]

[project.optional-dependencies]
data = [
  "tickflow>=0.1.0",
  "tushare>=1.4.21",
]

[tool.setuptools.packages.find]
where = ["src"]
